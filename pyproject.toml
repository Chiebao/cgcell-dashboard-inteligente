# Este arquivo guarda apenas a configuração das ferramentas de desenvolvimento.
# As dependências ficam em requirements.txt e requirements-dev.txt.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W: estilo (PEP 8) | F: erros (Pyflakes) | I: ordem dos imports
# UP: sintaxe moderna do Python | B: armadilhas comuns (Bugbear)
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
